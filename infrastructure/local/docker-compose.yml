# Local development environment.
#
# PostgreSQL and MinIO. The api and web services arrive with #20, which extends
# this same file rather than adding a second one.
#
# The credentials below are NOT secrets. They are deliberately obvious
# local-only values so that nobody mistakes them for something to protect, and
# so that a fresh clone runs without a setup step. Production credentials come
# from the environment and secrets handling introduced in #18 — never from this
# file and never from a committed default.
#
# Override any of them per developer with an untracked `.env` beside this file,
# e.g. POSTGRES_PORT=5433 when something already owns 5432.

name: tcg-analyzer-local

services:
  postgres:
    # Plain upstream PostgreSQL. Spec §8 keeps the deployment platform open
    # between ordinary PostgreSQL and Supabase, so local development runs the
    # lowest common denominator and nothing gets to depend on an extension that
    # only one of them has.
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tcg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tcg}
      POSTGRES_DB: ${POSTGRES_DB:-tcg}
      # Deterministic collation, so index ordering matches across machines.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # `pg_isready` reports true during initdb's temporary startup server too,
      # hence start_period: the first probe that counts happens after it.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tcg} -d ${POSTGRES_DB:-tcg}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  minio:
    # MinIO speaks the S3 API, so local development exercises the same protocol
    # a deployment will (spec §8 asks for "S3-compatible", not for AWS). Nothing
    # in the application knows which of the two it is talking to — that is the
    # point of the port in packages/shared.
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-tcg}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-tcglocaldev}
    ports:
      # 9000 is the S3 API; 9001 is the browser console, which is useful for
      # seeing what an upload actually produced.
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      # MinIO's own liveness endpoint. `mc ready` would need the client, which
      # this image has but the check would then depend on an alias being
      # configured first.
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  minio-bucket:
    # A one-shot container that creates the bucket and exits. Without it the
    # first `put` fails on a fresh volume and every developer has to be told to
    # click through the console — a setup step this file exists to avoid.
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER:-tcg}" "$${MINIO_ROOT_PASSWORD:-tcglocaldev}"
        mc mb --ignore-existing "local/$${TCG_API_STORAGE_BUCKET:-tcg-local}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-tcg}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-tcglocaldev}
      TCG_API_STORAGE_BUCKET: ${TCG_API_STORAGE_BUCKET:-tcg-local}
    # It is meant to exit 0 and stay exited; restarting would recreate a bucket
    # that already exists, once every few seconds, forever.
    restart: "no"

volumes:
  postgres-data:
  minio-data:
