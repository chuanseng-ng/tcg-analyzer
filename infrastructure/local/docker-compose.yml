# Local development environment — the whole application, in one command.
#
#   docker compose -f infrastructure/local/docker-compose.yml up -d --wait
#
# Brings up PostgreSQL, RustFS, Redis, the FastAPI service, the analysis worker
# and the Next.js application, having first run the migrations. That is M0's acceptance criterion: a
# developer can clone the repository and run the complete empty application
# locally without a setup step.
#
# For a hot-reloading loop use `watch` in place of `up`:
#
#   docker compose -f infrastructure/local/docker-compose.yml watch
#
# which starts the same stack and then syncs source changes into the running
# containers. See docs/adr/0003-the-local-development-stack.md for why this is
# a file sync rather than a bind mount.
#
# The credentials below are NOT secrets. They are deliberately obvious
# local-only values so that nobody mistakes them for something to protect, and
# so that a fresh clone runs without a setup step. Production credentials come
# from the environment and secrets handling introduced in #18 — never from this
# file and never from a committed default.
#
# Override any of them per developer with an untracked `.env` beside this file,
# e.g. POSTGRES_PORT=5433 when something already owns 5432.

name: tcg-analyzer-local

# The API image serves two services — the long-running `api` and the one-shot
# `migrate` — which must be byte-identical, since the point of running
# migrations from the application's own image is that they cannot drift from
# the code that reads the schema. Naming the tag explicitly keeps Compose from
# building the same context twice under two generated names.
#
# The `worker` is deliberately *not* one of them any more: it builds
# `worker.Dockerfile`, which is this image plus the `worker` extra, so OpenCV
# stays out of the container that answers HTTP. See #36.
x-api-image: &api-image
  build:
    context: ../..
    dockerfile: infrastructure/docker/api.Dockerfile
  image: tcg-analyzer-local/api:dev

# Reached over the Compose network, so the host is the service name rather than
# localhost — and the port is the container's, never the published one.
x-api-database-url: &api-database-url
  TCG_API_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tcg}:${POSTGRES_PASSWORD:-tcg}@postgres:5432/${POSTGRES_DB:-tcg}

# The job queue, reached over the Compose network. A password even locally: the
# skill this project's worker configuration is based on hardcodes an
# unauthenticated `redis://localhost:6379`, and an unauthenticated broker is
# somewhere an attacker enqueues tasks straight into the worker. Deployment uses
# `rediss://` — see `.env.example`.
x-api-redis-url: &api-redis-url
  TCG_API_REDIS_URL: redis://:${REDIS_PASSWORD:-tcglocaldev}@redis:6379/0

# A container that cannot gain privileges it was not started with. Cheap, and
# the direction spec §56 requires of the ML worker that arrives in M6 — the
# baseline is established here, while there is nothing to break.
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    # Plain upstream PostgreSQL. Spec §8 keeps the deployment platform open
    # between ordinary PostgreSQL and Supabase, so local development runs the
    # lowest common denominator and nothing gets to depend on an extension that
    # only one of them has.
    image: postgres:17-alpine
    <<: *hardening
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tcg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tcg}
      POSTGRES_DB: ${POSTGRES_DB:-tcg}
      # Deterministic collation, so index ordering matches across machines.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # `pg_isready` reports true during initdb's temporary startup server too,
      # hence start_period: the first probe that counts happens after it.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tcg} -d ${POSTGRES_DB:-tcg}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  storage:
    # RustFS speaks the S3 API, so local development exercises the same protocol
    # a deployment will (spec §8 asks for "S3-compatible", not for AWS). Nothing
    # in the application knows which of the two it is talking to — that is the
    # point of the port in packages/shared. It replaced MinIO when MinIO
    # withdrew its public images from Docker Hub and quay.io (ADR 0013); the
    # service is named for its role so the next vendor change is a one-line edit.
    image: rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    <<: *hardening
    environment:
      RUSTFS_ACCESS_KEY: ${STORAGE_ROOT_USER:-tcg}
      RUSTFS_SECRET_KEY: ${STORAGE_ROOT_PASSWORD:-tcglocaldev}
      # The browser console, which is useful for seeing what an upload
      # actually produced.
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      # 9000 is the S3 API; 9001 is the browser console.
      - "${STORAGE_PORT:-9000}:9000"
      - "${STORAGE_CONSOLE_PORT:-9001}:9001"
    volumes:
      - storage-data:/data
    healthcheck:
      # The server's own liveness endpoint; curl is in the image.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # The bucket, created before anything writes to it. MinIO let a `mkdir` under
  # its data root stand in for this; RustFS keeps bucket metadata of its own, so
  # the bucket is made through the API by the client image. A one-shot: `up
  # --wait` exempts a service that others depend on with
  # `service_completed_successfully`, exactly as it does `migrate`.
  storage-init:
    image: rustfs/rc:v0.1.36@sha256:ab024bfebee49a750ce886b4c70963ccd9ddaa03f491704a90710641d7a26699
    <<: *hardening
    environment:
      STORAGE_ROOT_USER: ${STORAGE_ROOT_USER:-tcg}
      STORAGE_ROOT_PASSWORD: ${STORAGE_ROOT_PASSWORD:-tcglocaldev}
      BUCKET: ${TCG_API_STORAGE_BUCKET:-tcg-local}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        rc alias set tcg http://storage:9000 "$$STORAGE_ROOT_USER" "$$STORAGE_ROOT_PASSWORD" >/dev/null
        rc mb --ignore-existing "tcg/$$BUCKET"
    depends_on:
      storage:
        condition: service_healthy
    restart: "no"

  redis:
    # The broker the analysis job queue runs on (spec §8). Redis rather than a
    # second PostgreSQL table because #98's rate limiter needs a shared counter
    # store next, and this is the store it shares — the alternative was two
    # pieces of infrastructure for two consumers.
    #
    # No volume. A broker holds work in flight, not state; losing it locally
    # costs a queued analysis that can be re-run, and persisting it would mean a
    # `down` that leaves jobs to be delivered to the next stack.
    image: redis:8-alpine
    <<: *hardening
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-tcglocaldev}
    environment:
      # Read by `redis-cli` in the healthcheck below, so the password is not on
      # a command line every `ps` in the container can see.
      REDISCLI_AUTH: ${REDIS_PASSWORD:-tcglocaldev}
    ports:
      # Published so a host-based `uv run pytest -m integration` can reach it,
      # exactly as PostgreSQL and the object store are.
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  migrate:
    # Schema first, then the service that depends on it. Running migrations as
    # a separate step rather than from the API's own startup is deliberate:
    # startup migrations race each other the moment there is more than one
    # replica, and this is the shape that survives into a deployment.
    #
    # It runs from the API image, so the migrations that run are always the
    # ones that shipped with the code reading the schema.
    <<: [*api-image, *hardening]
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *api-database-url
      TCG_API_LOG_FORMAT: ${TCG_API_LOG_FORMAT:-json}
    depends_on:
      postgres:
        condition: service_healthy
    # This container is finished when it exits. Restarting it would re-run
    # `upgrade head` in a loop against an already-current database.
    restart: "no"

  api:
    <<: [*api-image, *hardening]
    # `--reload` rather than the image's plain `uvicorn`, paired with the watch
    # rules below. `uvicorn[standard]` already carries watchfiles, so this needs
    # no dependency the production image lacks. The reload directories are
    # named explicitly because the default watches the whole working directory,
    # which here includes `.venv` and every installed package in it.
    command:
      - uvicorn
      - tcg_api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/services/api/src
      - --reload-dir
      - /app/packages
    environment:
      <<: [*api-database-url, *api-redis-url]
      # The API reaches the store over the Compose network. A signed URL generated
      # against this endpoint is NOT reachable from a browser on the host —
      # ADR 0002 records that, and M2 adds a separate public-endpoint setting
      # when there is finally something to upload.
      TCG_API_STORAGE_ENDPOINT_URL: http://storage:9000
      TCG_API_STORAGE_BUCKET: ${TCG_API_STORAGE_BUCKET:-tcg-local}
      TCG_API_STORAGE_ACCESS_KEY_ID: ${STORAGE_ROOT_USER:-tcg}
      TCG_API_STORAGE_SECRET_ACCESS_KEY: ${STORAGE_ROOT_PASSWORD:-tcglocaldev}
      # Spelled out rather than left to the default, so that overriding
      # WEB_PORT or ANNOTATION_PORT does not silently break CORS for the app
      # that was moved. **Both applications are here**: the annotation tool is a
      # browser client of this API too, and leaving it out fails as a fetch that
      # never arrives — which the tool can only report as "not answering".
      TCG_API_CORS_ORIGINS: '["http://localhost:${WEB_PORT:-3000}","http://localhost:${ANNOTATION_PORT:-3001}"]'
      # Who the annotation tool records as the author of a label. Passed rather
      # than left to the default because a value nobody can see is being
      # recorded is worse than one in a file — spec §30 asks that it never be
      # typed, so this is the only place it is chosen.
      TCG_API_ANNOTATOR_ID: ${TCG_API_ANNOTATOR_ID:-annotator}
      TCG_API_LOG_FORMAT: ${TCG_API_LOG_FORMAT:-json}
      TCG_API_LOG_LEVEL: ${TCG_API_LOG_LEVEL:-INFO}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # The healthcheck is inherited from the image, and it probes `/health`
    # rather than `/readiness` on purpose: `/health` consults no dependency, so
    # it reports this container's own liveness. A database outage must not make
    # the liveness probe fail and get the container killed.
    restart: unless-stopped
    develop:
      watch:
        # uv installs workspace members editable, so the interpreter is already
        # looking at these paths — a synced file is picked up with no reinstall.
        - action: sync
          path: ../../services/api/src
          target: /app/services/api/src
        - action: sync
          path: ../../packages
          target: /app/packages
        # A dependency change cannot be synced into an existing environment.
        - action: rebuild
          path: ../../uv.lock

  worker:
    # The analysis worker (spec §8, §65). It runs the same application as the
    # API, from an image of its own: #36's quality gate brought OpenCV, and a CV
    # stack decoding untrusted photographs has no business inside an
    # internet-facing web server. The two images differ by one uv extra and
    # nothing else, so the code that processes a job still cannot drift from the
    # code that enqueued it. Spec §56's isolation is this container's: no
    # published port, every capability dropped, no new privileges.
    #
    # Deliberately NOT `read_only: true` — the watch rules below sync source
    # into /app, and a read-only root filesystem would break hot reload. The
    # image split did not change that; the sync is what stands in the way, and a
    # deployment that does not hot-reload should take the filesystem.
    <<: *hardening
    build:
      context: ../..
      dockerfile: infrastructure/docker/worker.Dockerfile
    image: tcg-analyzer-local/worker:dev
    command:
      - celery
      - --app
      - tcg_api.analysis.worker
      - worker
      # Spec §54's retention sweep (#41) is scheduled by Celery beat, embedded
      # in this worker rather than given a service of its own: the schedule is
      # one entry, and a standalone `celery beat` does not answer the image's
      # `inspect ping` healthcheck. The schedule file goes to /tmp because the
      # image runs as the unprivileged `tcg` user.
      #
      # ponytail: two worker replicas would run two schedulers. The sweep is
      # idempotent so that is survivable, but a deployment that scales the
      # worker out should give beat a process.
      - --beat
      - --schedule
      - /tmp/celerybeat-schedule
      - --queues
      - analysis
      - --concurrency
      - "2"
      - --loglevel
      - ${TCG_API_LOG_LEVEL:-INFO}
    cap_drop:
      - ALL
    # The healthcheck is the image's own now: it probes the broker with `celery
    # inspect ping`, which is the one dependency that matters here. It used to
    # be overridden in this file because the API image's `/health` probe was
    # inherited and there is no HTTP server in a worker.
    environment:
      <<: [*api-database-url, *api-redis-url]
      # The worker reads uploaded photographs back out of object storage to run
      # spec §19's quality gate over them, so it needs the same storage
      # configuration the API has. Before #36 it had none and could not have.
      TCG_API_STORAGE_ENDPOINT_URL: http://storage:9000
      TCG_API_STORAGE_BUCKET: ${TCG_API_STORAGE_BUCKET:-tcg-local}
      TCG_API_STORAGE_ACCESS_KEY_ID: ${STORAGE_ROOT_USER:-tcg}
      TCG_API_STORAGE_SECRET_ACCESS_KEY: ${STORAGE_ROOT_PASSWORD:-tcglocaldev}
      TCG_API_LOG_FORMAT: ${TCG_API_LOG_FORMAT:-json}
      TCG_API_LOG_LEVEL: ${TCG_API_LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ../../services/api/src
          target: /app/services/api/src
        - action: sync
          path: ../../packages
          target: /app/packages
        - action: rebuild
          path: ../../uv.lock

  web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/web.Dockerfile
    <<: *hardening
    environment:
      # The browser's view of the API, not the Compose network's. `ApiStatus`
      # is a client component, so the only fetch in the application runs in the
      # browser — `http://api:8000` would resolve for the container and for
      # nobody else.
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${API_PORT:-8000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ../../apps/web
          target: /app/apps/web
          ignore:
            - node_modules/
            - .next/
        - action: rebuild
          path: ../../pnpm-lock.yaml

  # The internal annotation tool. A separate service on a separate port because
  # it is a separate application and, in a deployment, a separate ingress: ADR
  # 0009 requires it be unroutable from the public origin, and running it beside
  # `web` locally is a convenience rather than a statement about where it lives.
  annotation:
    build:
      context: ../..
      dockerfile: infrastructure/docker/annotation.Dockerfile
    <<: *hardening
    environment:
      # The browser's view of the API, exactly as `web`'s is: every fetch this
      # application makes runs in the browser, so `http://api:8000` would
      # resolve for the container and for nobody else.
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${API_PORT:-8000}
    ports:
      - "${ANNOTATION_PORT:-3001}:3001"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ../../apps/annotation
          target: /app/apps/annotation
          ignore:
            - node_modules/
            - .next/
        - action: rebuild
          path: ../../pnpm-lock.yaml

volumes:
  postgres-data:
  storage-data:
