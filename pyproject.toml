[project]
name = "tcg-grading-advisor"
version = "0.0.0"
description = "TCG Grading Advisor — uv workspace root"
requires-python = ">=3.12"
dependencies = []

# The root is a workspace container, not a distributable package.
[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "services/*", "ml/*", "ml/grading/*"]
# `ml/grading/` groups the per-company predictors; it is not itself a package.
exclude = ["ml/grading"]

[dependency-groups]
# `tzdata` backs alembic.ini's `timezone = UTC`: Windows ships no tz database,
# so without it `alembic revision` cannot stamp a filename.
dev = ["httpx>=0.27", "pytest>=8", "tzdata>=2024.1"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages", "services", "ml"]
markers = ["integration: requires a live PostgreSQL (set TCG_API_DATABASE_URL)"]
