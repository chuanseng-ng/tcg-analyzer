[project]
name = "tcg-api"
version = "0.0.0"
description = "FastAPI HTTP surface for TCG Grading Advisor"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "asyncpg>=0.29",
    # The job queue (spec §8). `[redis]` brings the broker transport; there is
    # deliberately no result backend, since status is polled from PostgreSQL.
    # The worker runs from this same image, so this is a runtime dependency of
    # `tcg-api` rather than of a package of its own — see
    # `tcg_api/analysis/jobs.py` for why the worker is not its own image yet.
    "celery[redis]>=5.4",
    "fastapi>=0.115",
    # The TCGdex catalog import (ADR 0004) is the only outbound HTTP this
    # service makes, and `tcg_api.catalog.tcgdex` is the only module that
    # imports this. Declared here rather than left to the dev group: the
    # console script below has to work from `uv sync --package tcg-api`.
    "httpx>=0.27",
    # The upload endpoint's validator (#33). Pillow is the content sniffer —
    # `Image.open` reads magic bytes, never the declared Content-Type — the
    # decodability check, the dimension reader used to refuse a decompression
    # bomb before it is decoded, and the lossless PNG re-saver. Writing our own
    # JPEG and PNG header parsers instead would be more code and less
    # trustworthy on exactly the input this project must not get wrong.
    "pillow>=11",
    # Imported directly by database.py and routers/readiness.py, so it is
    # declared directly. Arriving transitively via fastapi/pydantic-settings
    # would let either package's pin silently break those modules.
    "pydantic>=2",
    # The rate limiter's counter store (#98). Already resolved through
    # `celery[redis]`, and declared here for the reason `pydantic` is: a
    # transitive pin is not a contract, and `tcg_api.rate_limit` imports it
    # directly. Needs a Redis server >= 7 for `EXPIRE ... NX`.
    "redis>=5",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.52",
    "structlog>=24.4",
    # The catalog seed loader validates every fixture by constructing the domain
    # entity, so a malformed record fails with the domain's own message rather
    # than as a constraint violation mid-transaction.
    "tcg-domain",
    # Spec §39–§47's economics: the cost configuration and the recommendation
    # thresholds `tcg_api.economics` stores, and the figures
    # `GET /analyses/{id}/results` reports. Declared for the reason
    # `tcg-shared`'s entry gives below. It brings nothing transitive — it depends
    # on `tcg-domain` and nothing else, which its own purity test enforces — and
    # it reaches no network, database or vendor SDK.
    "tcg-economic-engine",
    # Spec §23's published rules records, which `tcg_api.grading.seed` writes
    # into `grading_rules` and `tcg_api.grading.rules` reads back out. Declared
    # for the reason `tcg-shared`'s entry gives below. It brings nothing
    # transitive: `tcg-grading-companies` depends only on `tcg-domain`, which is
    # already here, and it reaches no network, database or vendor SDK.
    "tcg-grading-companies",
    # Spec §33's `MarketDataProvider` port, and `MarketType` — which
    # `tcg_api.market.tables` builds §35's generated `market_type` column from
    # rather than retyping the two strings. Declared for the reason
    # `tcg-shared`'s entry gives below. It brings nothing transitive:
    # `tcg-market-data` depends only on `tcg-domain` and
    # `tcg-grading-companies`, both already here, and it reaches no network,
    # database or vendor SDK.
    "tcg-market-data",
    # The object-storage port and its S3 adapter. Declared rather than left to
    # `uv sync --all-packages`, which installs every member editable and would
    # hide the omission locally: `infrastructure/docker/api.Dockerfile` runs
    # `uv sync --package tcg-api`, which resolves only what is named here.
    "tcg-shared",
    "uvicorn[standard]>=0.52.3",
]

# The analysis worker's extras, and nothing the HTTP surface needs.
#
# Every member here brings OpenCV — the three pipeline stages directly, and
# `tcg-ml-condition` through the four axis analyzers it composes — and
# OpenCV has no business in an internet-facing web server:
# `infrastructure/docker/api.Dockerfile` syncs `--package tcg-api` and gets
# none of it, while `worker.Dockerfile` adds `--extra worker` and gets all of
# it. What makes that split hold at runtime is
# that `tcg_api.analysis.jobs` imports the gate's and the condition step's
# wiring inside the function
# that runs a job rather than at module scope — `tests/test_import_purity.py`
# asserts it, because the symptom of getting it wrong is an API container that
# will not start.
#
# `tcg-ml-condition` alone would pull the four analyzers transitively; all
# five are named so the worker's contract is readable at the extra rather
# than inferred through that package's manifest, matching the per-module
# assertions in `.github/workflows/ci.yml`.
#
# A developer running `uv sync --all-packages` still gets everything: each ml
# member declares OpenCV itself, and extras are only about what *this* package
# pulls in.
[project.optional-dependencies]
worker = [
    "tcg-ml-card-detection",
    "tcg-ml-centering",
    "tcg-ml-condition",
    "tcg-ml-corners",
    "tcg-ml-edges",
    "tcg-ml-image-quality",
    "tcg-ml-normalization",
    "tcg-ml-surface",
]

[tool.uv.sources]
tcg-domain = { workspace = true }
tcg-economic-engine = { workspace = true }
tcg-grading-companies = { workspace = true }
tcg-market-data = { workspace = true }
tcg-ml-card-detection = { workspace = true }
tcg-ml-centering = { workspace = true }
tcg-ml-condition = { workspace = true }
tcg-ml-corners = { workspace = true }
tcg-ml-edges = { workspace = true }
tcg-ml-image-quality = { workspace = true }
tcg-ml-normalization = { workspace = true }
tcg-ml-surface = { workspace = true }
tcg-shared = { workspace = true }

# `apps/web` generates its API types from this schema (ADR 0001), so producing
# it must not require starting a server.
[project.scripts]
tcg-api-schema = "tcg_api.schema:main"
# Loads `database/seeds/catalog/` into the configured database. Idempotent, so
# it is safe to re-run after editing a fixture. See `database/seeds/README.md`.
tcg-seed-catalog = "tcg_api.catalog.seed:main"
# Fetches the canonical catalog from TCGdex into a snapshot and loads it,
# publishing an immutable card_database_version per run. See ADR 0004.
tcg-import-catalog = "tcg_api.catalog.import_catalog:main"
# Writes the published PSA/TAG/BGS rules versions from `tcg_grading_companies`
# into `grading_rules` (spec §23). Idempotent; a published version is never
# rewritten, and the database refuses it if anything tries.
tcg-seed-grading-rules = "tcg_api.grading.seed:main"
# One invocation is one physical card (spec §32's grouping key), and every
# photograph it ingests passes ADR 0008's provenance gate before a byte is
# stored. There is deliberately no HTTP route: nothing in the dataset domain is
# a consumer surface.
tcg-ingest-training-images = "tcg_api.datasets.ingestion:main"
# Fingerprints every training image that has none and reports the near-duplicate
# groups spec §32's splitter must not break apart. Exact duplicates are already
# unrepresentable (uq_training_images_sha256), so this is only the near half.
# **Runs from the worker image**: hashing needs the normalized artifact, which
# needs the CV stack in the `worker` extra above.
tcg-detect-duplicate-training-images = "tcg_api.datasets.deduplication:main"
# Stores the standardized artifact spec §30's annotation tool shows and #158's
# coordinates are fractions of, for every training image that has none. A stored
# artifact is never replaced: an annotation is a fraction of the artifact its
# annotator saw. **Runs from the worker image**, for deduplication's reason.
tcg-normalize-training-images = "tcg_api.datasets.normalization:main"
# Freezes the corpus as it stands into spec §31's immutable `dataset_version`,
# writing the version and every member's split in one transaction, and renders
# the manifest into `datasets/manifests/`. The manifest is a render of the rows
# rather than a record, so `--regenerate` reproduces it byte for byte.
tcg-publish-dataset-version = "tcg_api.datasets.versioning:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tcg_api"]
