[project]
name = "tcg-ml-edges"
version = "0.0.0"
description = "Edge classification: spec §15's edges, four per side, judged from the normalized artifact"
requires-python = ">=3.12"
dependencies = [
    "opencv-python-headless>=4.10",   # headless: plain opencv-python links libGL
    "numpy>=2",
    "tcg-domain",
]

[tool.uv.sources]
tcg-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tcg_ml_edges"]
