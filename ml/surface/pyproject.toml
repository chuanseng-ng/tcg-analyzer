[project]
name = "tcg-ml-surface"
version = "0.0.0"
description = "Surface classification: spec §16's coarse defects from the normalized artifact, the fine four refused per ADR 0010"
requires-python = ">=3.12"
dependencies = [
    "opencv-python-headless>=4.10",   # headless: plain opencv-python links libGL
    "numpy>=2",
    "tcg-domain",
]

[tool.uv.sources]
tcg-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tcg_ml_surface"]
