[project]
name = "tcg-ml-normalization"
version = "0.0.0"
description = "Perspective correction and normalization: the standardized card artifact"
requires-python = ">=3.12"
dependencies = [
    # The warp and the resampling. **Headless** for the reason `ml/image-quality`
    # gives: plain `opencv-python` links against libGL and raises ImportError in
    # a slim image with no X stack, which a worker container has no reason to
    # carry.
    "opencv-python-headless>=4.10",
    # A transitive dependency of OpenCV; named because this package uses it
    # directly for the corner arithmetic.
    "numpy>=2",
    # `CardGeometry`, `Uncertain` and `InsufficientInformation`. Stdlib-only,
    # and the reason this package needs no dependency on the detector that
    # produced the quadrilateral it warps.
    "tcg-domain",
]

[tool.uv.sources]
tcg-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tcg_ml_normalization"]
