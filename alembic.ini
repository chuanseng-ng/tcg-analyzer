# Alembic configuration.
#
# The database URL is deliberately absent: `database/migrations/env.py` reads it
# from TCG_API_DATABASE_URL, the same variable the API service uses. Connection
# strings carry credentials and must never be committed.

[alembic]
# Both paths resolve against the current working directory, not against this
# file. Run `alembic` from the repository root.
script_location = database/migrations
prepend_sys_path = .

# Chronologically sortable filenames, so `ls versions/` and the revision graph
# agree on the order and a reviewer can see at a glance when a migration landed.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d%%(second).2d_%%(rev)s_%%(slug)s

# Migration timestamps are UTC; developers and CI are not in the same timezone.
timezone = UTC

# Truncate the slug rather than emit paths that break on Windows.
truncate_slug_length = 40


[post_write_hooks]
# No formatter hooks yet; linting arrives with the repo-wide toolchain (#17).


# ---------------------------------------------------------------------------
# Logging. Alembic configures logging through this file at startup.
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
