# Keeps dependencies current without a standing manual chore.
#
# Updates are grouped: a dozen separate patch-bump PRs a week is how people
# learn to stop reading them. Majors stay separate because they are the ones
# that need judgement.
version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      # Matches the repository's Conventional Commits convention, which the
      # pr-title workflow enforces.
      prefix: build
      include: scope
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Next, React and their types move together; a lone bump of one usually
      # breaks against the others. Upgrade them deliberately, not automatically.
      - dependency-name: next
        update-types: [version-update:semver-major]
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      actions:
        update-types: [minor, patch, major]

  - package-ecosystem: docker
    directory: /infrastructure/docker
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
      include: scope
