# Enforces the Definition of Done (spec §71). Without CI from the start that
# list is aspirational, so every check here maps to a line on it.
#
# Jobs are split rather than sequential so a failure names the thing that broke:
# "web" red and "python" green is a different conversation from the reverse.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A force-push supersedes the run it interrupts. `main` is exempt: those runs
# are the record of what was actually merged.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # Pinned so a toolchain bump is a reviewed commit rather than a surprise.
  NODE_VERSION: "24"

jobs:
  python:
    name: Python — lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # `--frozen` fails rather than silently relocking, so CI cannot pass
      # against a dependency set that is not the one in the lockfile.
      - run: uv sync --all-packages --frozen

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy packages/domain/src packages/shared/src services/api/src

      # Tests needing a live service are deselected here and covered by the jobs
      # that have one: `migrations` has PostgreSQL, `storage` has MinIO. Nothing
      # covers `network`, on purpose — it reaches api.tcgdex.net, which ADR 0004
      # records as having no SLA and no published rate limit, so a CI job
      # depending on it would fail for reasons that are not this repository's.
      - name: Tests
        run: uv run pytest -m "not integration and not object_storage and not network"

  web:
    name: Web — lint, format, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # The API type check builds the FastAPI app to read its OpenAPI schema,
      # so this job needs the Python toolchain too (ADR 0001).
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: pnpm install --frozen-lockfile
      - run: uv sync --all-packages --frozen

      - name: Lint
        run: pnpm --filter @tcg/web lint

      - name: Format
        run: pnpm --filter @tcg/web format:check

      # The frontend/backend contract is the OpenAPI schema, not a shared
      # package. If the committed types no longer match it, the frontend is
      # compiling against a contract the server has stopped honouring.
      - name: API types are current
        run: pnpm --filter @tcg/web gen:api-types:check

      - name: Types
        run: pnpm --filter @tcg/web typecheck

      - name: Tests
        run: pnpm --filter @tcg/web test

      - name: Build
        run: pnpm --filter @tcg/web build

  migrations:
    name: Migrations — fresh database
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tcg
          POSTGRES_PASSWORD: tcg
          POSTGRES_DB: tcg
        ports:
          - 5432:5432
        # Without this the first migration races the database's startup.
        options: >-
          --health-cmd "pg_isready -U tcg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TCG_API_DATABASE_URL: postgresql+asyncpg://tcg:tcg@localhost:5432/tcg

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv sync --all-packages --frozen

      # The database starts empty, so `upgrade head` here is the real assertion
      # that the migration history stands on its own. Down-and-up again proves
      # `downgrade` is not merely declared.
      - name: Apply, revert, reapply
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Integration tests
        run: uv run pytest -m integration

  storage:
    name: Storage — signed URLs against MinIO
    runs-on: ubuntu-latest

    # Not a `services:` block: MinIO needs `server /data`, and a service
    # container cannot supply a command. Running the Compose file instead has a
    # second benefit — it makes that file a tested artifact rather than one
    # nobody exercises until a developer clones the repository.
    env:
      TCG_API_STORAGE_ENDPOINT_URL: http://localhost:9000
      TCG_API_STORAGE_BUCKET: tcg-local
      TCG_API_STORAGE_ACCESS_KEY_ID: tcg
      TCG_API_STORAGE_SECRET_ACCESS_KEY: tcglocaldev

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv sync --all-packages --frozen

      # `--wait` blocks until MinIO's healthcheck passes, so the first signed
      # request does not race the store's startup.
      - name: Start MinIO
        run: >-
          docker compose -f infrastructure/local/docker-compose.yml
          up -d --wait minio

      - name: Object-storage tests
        run: uv run pytest -m object_storage

      - name: Stop MinIO
        if: always()
        run: docker compose -f infrastructure/local/docker-compose.yml down -v

  docker:
    name: Docker — ${{ matrix.image }} image builds
    runs-on: ubuntu-latest
    strategy:
      # Both images build independently, and a failure should name the one that
      # broke rather than stop at whichever came first.
      fail-fast: false
      matrix:
        image: [api, web]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Build only. Publishing is a deployment concern and deliberately out of
      # scope; this answers "would this image build for anyone else?".
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infrastructure/docker/${{ matrix.image }}.Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  compose:
    name: Compose — the whole stack starts
    runs-on: ubuntu-latest
    # M0's acceptance criterion is that a developer can clone the repository and
    # run the complete empty application locally. That is a claim about this
    # exact command, so it is asserted rather than described. The unit-level
    # wiring checks live in `tests/test_compose_stack.py` and need no Docker.
    env:
      COMPOSE: docker compose -f infrastructure/local/docker-compose.yml
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # `--wait` blocks until every long-running service is healthy and the
      # one-shot `migrate` service has exited successfully, so nothing below
      # races the stack's startup.
      - name: Start the stack
        run: $COMPOSE up -d --wait

      # `up --wait` waits for services to be running or healthy, and a
      # container that has finished its job is neither — the trap that made
      # MinIO create its own bucket rather than use an `mc` init container. The
      # `migrate` service is exempt because `api` depends on it with
      # `service_completed_successfully`; this asserts that exemption holds
      # rather than trusting it.
      - name: Migrations ran and exited cleanly
        run: |
          $COMPOSE ps -a
          test "$($COMPOSE ps -aq migrate | xargs docker inspect -f '{{.State.ExitCode}}')" = 0

      # `/health` is dependency-free by design, so it proves only that the
      # container is alive. `/readiness` is the one that proves the stack was
      # actually wired together: it returns 503 unless the API reached both
      # PostgreSQL and MinIO.
      - name: The API is live
        run: curl -fsS --retry 5 --retry-all-errors localhost:8000/health

      - name: The API reached PostgreSQL and MinIO
        run: |
          readiness=$(curl -fsS --retry 5 --retry-all-errors localhost:8000/readiness)
          echo "$readiness"
          test "$(echo "$readiness" | jq -r '.status')" = ok
          test "$(echo "$readiness" | jq -r '.checks.database')" = ok
          test "$(echo "$readiness" | jq -r '.checks.storage')" = ok

      # The worker has no port to probe and no healthcheck to wait on — nothing
      # calls a Celery worker — so the honest assertion is that it is still up
      # after connecting to Redis and PostgreSQL rather than crash-looping.
      - name: The analysis worker is running
        run: |
          $COMPOSE ps worker
          test "$($COMPOSE ps -q worker | xargs docker inspect -f '{{.State.Status}}')" = running
          $COMPOSE logs worker | grep -q "celery@"

      # The one place the limiter meets a real Redis: the unit tests drive it
      # through a stub, which proves the branch and not the store. Thirty is the
      # default `TCG_API_RATE_LIMIT_REQUESTS`, so the thirty-first call inside
      # the window is the first that must be refused.
      - name: The analysis endpoints are rate-limited
        run: |
          for _ in $(seq 1 30); do
            curl -sS -o /dev/null -X POST localhost:8000/analyses
          done
          throttled=$(curl -sS -D - -o /dev/null -X POST localhost:8000/analyses)
          echo "$throttled"
          echo "$throttled" | grep -q "429"
          echo "$throttled" | grep -qi "^retry-after:"

      # The counter must expire, and traffic inside a window must not push that
      # expiry outwards — a plain `EXPIRE` in place of `EXPIRE ... NX` would
      # refresh it on every request and lock a steady client out for good. The
      # unit tests drive a stub that implements `nx`; this is the same claim
      # against the real server. `redis-cli` reads its password from the
      # container's own REDISCLI_AUTH.
      - name: A throttled client's window ends rather than being extended
        run: |
          redis() { $COMPOSE exec -T redis redis-cli --no-auth-warning "$@" | tr -d "\r"; }
          key=$(redis --scan --pattern "ratelimit:analyses:*" | head -1)
          test -n "$key"
          before=$(redis pttl "$key")
          test "$before" -gt 0
          sleep 2
          curl -sS -o /dev/null -X POST localhost:8000/analyses
          after=$(redis pttl "$key")
          echo "pttl $before -> $after"
          test "$after" -lt "$before"

      # The load-bearing half of "fails open" (ADR 0005). A unit test drives a
      # stub that raises, which proves the branch; only this proves that what a
      # real down Redis raises is inside the caught set — the regression it
      # guards against is a narrowed `except` turning a Redis outage into an
      # outage of the endpoints the limiter exists to keep available.
      - name: A limiter whose Redis is down does not refuse traffic
        run: |
          $COMPOSE stop redis
          test "$(curl -sS -o /dev/null -w '%{http_code}' -X POST localhost:8000/analyses)" = 201
          $COMPOSE logs api | grep -q "ratelimit.unavailable"
          $COMPOSE up -d --wait redis

      - name: The web application serves
        run: curl -fsS --retry 10 --retry-all-errors -o /dev/null localhost:3000

      - name: Logs
        if: failure()
        run: $COMPOSE logs --no-color

      - name: Stop the stack
        if: always()
        run: $COMPOSE down -v

  secrets:
    name: Secrets — no credentials in history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Scanning the diff alone is not enough. A key removed from the
          # working tree is still a leaked key, and this project may be
          # open-sourced later — history is what gets published.
          fetch-depth: 0

      # Run the tool directly rather than through an action: no licence
      # handling, no marketplace dependency, and the version is visible here.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.28.0 \
            detect --source=/repo --redact --verbose --no-banner

  dependencies:
    name: Dependencies — vulnerabilities and licences
    runs-on: ubuntu-latest
    # Compares a PR's dependency changes against its base, so there is nothing
    # to compare on a push to main.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          # Copyleft licences are the concern for a product that may ship
          # commercially. Flagged for a human rather than merged silently.
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0, LGPL-3.0
