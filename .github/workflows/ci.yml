# Enforces the Definition of Done (spec §71). Without CI from the start that
# list is aspirational, so every check here maps to a line on it.
#
# Jobs are split rather than sequential so a failure names the thing that broke:
# "web" red and "python" green is a different conversation from the reverse.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The dependency audit and the image scan are the two checks whose answer
  # changes without anything in this repository changing: a CVE is published
  # against a version that was clean when it merged. A gate that only runs on
  # a pull request never asks again. `codeql.yml` is on 03:00 Monday; this is
  # three hours later, beside Dependabot's own Monday run.
  schedule:
    - cron: "0 6 * * 1"

# A force-push supersedes the run it interrupts. `main` is exempt: those runs
# are the record of what was actually merged.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # Pinned so a toolchain bump is a reviewed commit rather than a surprise.
  NODE_VERSION: "26"

jobs:
  python:
    name: Python — lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # `--frozen` fails rather than silently relocking, so CI cannot pass
      # against a dependency set that is not the one in the lockfile.
      - run: uv sync --all-packages --frozen

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy packages/domain/src packages/shared/src packages/grading-companies/src packages/market-data/src packages/economic-engine/src services/api/src ml/image-quality/src ml/card-detection/src ml/normalization/src ml/centering/src ml/corners/src ml/edges/src ml/surface/src ml/condition/src ml/evaluation/src ml/grading/psa/src ml/grading/tag/src ml/grading/bgs/src

      # Tests needing a live service are deselected here and covered by the jobs
      # that have one: `migrations` has PostgreSQL, `storage` has MinIO. Nothing
      # covers `network`, on purpose — it reaches api.tcgdex.net, which ADR 0004
      # records as having no SLA and no published rate limit, so a CI job
      # depending on it would fail for reasons that are not this repository's.
      - name: Tests
        run: uv run pytest -m "not integration and not object_storage and not network"

  web:
    name: Web — lint, format, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # The API type check builds the FastAPI app to read its OpenAPI schema,
      # so this job needs the Python toolchain too (ADR 0001).
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: pnpm install --frozen-lockfile
      - run: uv sync --all-packages --frozen

      - name: Lint
        run: pnpm --filter @tcg/web lint

      - name: Format
        run: pnpm --filter @tcg/web format:check

      # The frontend/backend contract is the OpenAPI schema, not a shared
      # package. If the committed types no longer match it, the frontend is
      # compiling against a contract the server has stopped honouring.
      - name: API types are current
        run: pnpm --filter @tcg/web gen:api-types:check

      - name: Types
        run: pnpm --filter @tcg/web typecheck

      - name: Tests
        run: pnpm --filter @tcg/web test

      - name: Build
        run: pnpm --filter @tcg/web build

  # A job of its own rather than a matrix over the two applications. The header
  # above says jobs are split so a failure names the thing that broke, and
  # "annotation red, web green" is a different conversation from the reverse.
  annotation:
    name: Annotation — lint, format, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # The API type check builds the FastAPI app to read its OpenAPI schema,
      # so this job needs the Python toolchain too (ADR 0001).
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: pnpm install --frozen-lockfile
      - run: uv sync --all-packages --frozen

      - name: Lint
        run: pnpm --filter @tcg/annotation lint

      - name: Format
        run: pnpm --filter @tcg/annotation format:check

      - name: API types are current
        run: pnpm --filter @tcg/annotation gen:api-types:check

      - name: Types
        run: pnpm --filter @tcg/annotation typecheck

      - name: Tests
        run: pnpm --filter @tcg/annotation test

      - name: Build
        run: pnpm --filter @tcg/annotation build

  migrations:
    name: Migrations — fresh database
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tcg
          POSTGRES_PASSWORD: tcg
          POSTGRES_DB: tcg
        ports:
          - 5432:5432
        # Without this the first migration races the database's startup.
        options: >-
          --health-cmd "pg_isready -U tcg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TCG_API_DATABASE_URL: postgresql+asyncpg://tcg:tcg@localhost:5432/tcg

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv sync --all-packages --frozen

      # The database starts empty, so `upgrade head` here is the real assertion
      # that the migration history stands on its own. Down-and-up again proves
      # `downgrade` is not merely declared.
      - name: Apply, revert, reapply
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Integration tests
        run: uv run pytest -m integration

  storage:
    name: Storage — MinIO, PostgreSQL and the anonymous journey
    runs-on: ubuntu-latest

    # Not a `services:` block: MinIO needs `server /data`, and a service
    # container cannot supply a command. Running the Compose file instead has a
    # second benefit — it makes that file a tested artifact rather than one
    # nobody exercises until a developer clones the repository.
    #
    # PostgreSQL comes from the same file, because #250's journey test needs
    # both: the upload writes a photograph the worker then reads back out of
    # the store. It is the one pytest module carrying both markers, and this
    # is the one job where it runs rather than skips.
    env:
      TCG_API_DATABASE_URL: postgresql+asyncpg://tcg:tcg@localhost:5432/tcg
      TCG_API_STORAGE_ENDPOINT_URL: http://localhost:9000
      TCG_API_STORAGE_BUCKET: tcg-local
      TCG_API_STORAGE_ACCESS_KEY_ID: tcg
      TCG_API_STORAGE_SECRET_ACCESS_KEY: tcglocaldev

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv sync --all-packages --frozen

      # `--wait` blocks until both healthchecks pass, so the first signed
      # request does not race the store's startup and the first migration
      # does not race the database's.
      - name: Start MinIO and PostgreSQL
        run: >-
          docker compose -f infrastructure/local/docker-compose.yml
          up -d --wait postgres minio

      - run: uv run alembic upgrade head

      - name: Object-storage tests, and the anonymous journey
        run: uv run pytest -m object_storage

      - name: Stop MinIO and PostgreSQL
        if: always()
        run: docker compose -f infrastructure/local/docker-compose.yml down -v

  docker:
    name: Docker — ${{ matrix.image }} ${{ matrix.target || 'development' }} image builds
    runs-on: ubuntu-latest
    strategy:
      # Every image builds independently, and a failure should name the one
      # that broke rather than stop at whichever came first. The two Next
      # applications appear twice: their Dockerfiles carry a development and a
      # production stage, and an untargeted build is the development one, so
      # the production shape the deployment overlay runs needs naming (#268).
      fail-fast: false
      matrix:
        include:
          - image: api
          - image: worker
          - image: web
          - image: web
            target: production
          - image: annotation
          - image: annotation
            target: production
    env:
      SCOPE: ${{ matrix.image }}-${{ matrix.target || 'development' }}
      TAG: tcg-${{ matrix.image }}:${{ matrix.target || 'development' }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Build only. Publishing is a deployment concern and deliberately out of
      # scope; this answers "would this image build for anyone else?". Every
      # image is loaded into the daemon because the steps below run against
      # one: the scan for all six, the smoke test for the production two.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infrastructure/docker/${{ matrix.image }}.Dockerfile
          target: ${{ matrix.target }}
          push: false
          load: true
          tags: ${{ env.TAG }}
          cache-from: type=gha,scope=${{ env.SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.SCOPE }}

      # Run directly rather than through `aquasecurity/trivy-action`, for the
      # reason the `secrets` job gives: no marketplace dependency, and the
      # version is visible here.
      #
      # `--ignore-unfixed` because a Debian base carries HIGH CVEs with no fix
      # published, and a gate that is permanently red is a gate people learn to
      # switch off. The answerable question is whether anything here is fixable
      # today and not fixed. `--scanners vuln` because gitleaks already reads
      # the history for secrets and this would only repeat it.
      - name: Scan the image
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/repo" \
            aquasec/trivy:0.74.0 image \
            --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 --ignorefile /repo/.trivyignore.yaml \
            "$TAG"

      # The acceptance criterion of #268 is an image that serves the built app,
      # which no build can show. The image's own HEALTHCHECK is already the
      # request that matters — `fetch('/')` and a check on `response.ok` — so
      # this waits for it rather than publishing a port and repeating it.
      - name: Smoke — the built image serves the application
        if: matrix.target == 'production'
        run: |
          docker run --detach --name smoke "$TAG"
          for _ in $(seq 30); do
            status="$(docker inspect -f '{{.State.Health.Status}}' smoke)"
            if [ "$status" = healthy ]; then
              # "as `tcg`", the other half of the acceptance criterion.
              test "$(docker exec smoke id -u)" = 1001
              exit 0
            fi
            if [ "$status" = unhealthy ]; then
              break
            fi
            sleep 2
          done
          echo "::error::the image never reported healthy (last status: $status)"
          docker logs smoke
          exit 1

  compose:
    name: Compose — the whole stack starts
    runs-on: ubuntu-latest
    # M0's acceptance criterion is that a developer can clone the repository and
    # run the complete empty application locally. That is a claim about this
    # exact command, so it is asserted rather than described. The unit-level
    # wiring checks live in `tests/test_compose_stack.py` and need no Docker.
    env:
      COMPOSE: docker compose -f infrastructure/local/docker-compose.yml
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # `--wait` blocks until every long-running service is healthy and the
      # one-shot `migrate` service has exited successfully, so nothing below
      # races the stack's startup.
      - name: Start the stack
        run: $COMPOSE up -d --wait

      # `up --wait` waits for services to be running or healthy, and a
      # container that has finished its job is neither — the trap that made
      # MinIO create its own bucket rather than use an `mc` init container. The
      # `migrate` service is exempt because `api` depends on it with
      # `service_completed_successfully`; this asserts that exemption holds
      # rather than trusting it.
      - name: Migrations ran and exited cleanly
        run: |
          $COMPOSE ps -a
          test "$($COMPOSE ps -aq migrate | xargs docker inspect -f '{{.State.ExitCode}}')" = 0

      # `/health` is dependency-free by design, so it proves only that the
      # container is alive. `/readiness` is the one that proves the stack was
      # actually wired together: it returns 503 unless the API reached both
      # PostgreSQL and MinIO.
      - name: The API is live
        run: curl -fsS --retry 5 --retry-all-errors localhost:8000/health

      - name: The API reached PostgreSQL, MinIO and Redis
        run: |
          readiness=$(curl -fsS --retry 5 --retry-all-errors localhost:8000/readiness)
          echo "$readiness"
          test "$(echo "$readiness" | jq -r '.status')" = ok
          test "$(echo "$readiness" | jq -r '.checks.database')" = ok
          test "$(echo "$readiness" | jq -r '.checks.storage')" = ok
          test "$(echo "$readiness" | jq -r '.checks.redis')" = ok

      # The worker has no port to probe and no healthcheck to wait on — nothing
      # calls a Celery worker — so the honest assertion is that it is still up
      # after connecting to Redis and PostgreSQL rather than crash-looping.
      - name: The analysis worker is running
        run: |
          $COMPOSE ps worker
          test "$($COMPOSE ps -q worker | xargs docker inspect -f '{{.State.Status}}')" = running
          $COMPOSE logs worker | grep -q "celery@"

      # The image split, asserted where it actually matters — in the containers
      # that get deployed rather than in a lockfile. `test_import_purity.py`
      # proves the request path does not *import* OpenCV; this proves the API
      # image does not *contain* it, which is the half a Python test run in a
      # developer's virtualenv can never see.
      - name: The CV stack is in the worker image and not in the API image
        run: |
          $COMPOSE exec -T worker python -c "
          import cv2, tcg_ml_card_detection, tcg_ml_image_quality, tcg_ml_normalization
          import tcg_ml_centering, tcg_ml_condition, tcg_ml_corners, tcg_ml_edges, tcg_ml_surface
          import tcg_ml_evaluation, tcg_ml_grading_bgs, tcg_ml_grading_psa, tcg_ml_grading_tag
          print(cv2.__version__)"

          # Deliberately not `! $COMPOSE exec ... python -c "import cv2"`.
          # `docker compose exec` does not reliably propagate the remote
          # command's exit status, so a negation there can report success
          # whichever way the import went — which is the failure mode this step
          # exists to catch. Assert on what the interpreter said instead.
          #
          # All twelve, because the split is one `--extra worker` and a package
          # left out of it is an ImportError the API container only finds at
          # startup. The three grade predictors bind no OpenCV and are asserted
          # absent all the same: a model has no business in the API image
          # (ADR 0011 decision 5).
          for module in cv2 tcg_ml_image_quality tcg_ml_card_detection tcg_ml_normalization \
              tcg_ml_centering tcg_ml_condition tcg_ml_corners tcg_ml_edges tcg_ml_surface \
              tcg_ml_evaluation tcg_ml_grading_bgs tcg_ml_grading_psa tcg_ml_grading_tag; do
            present=$($COMPOSE exec -T api python -c "
          try:
              import $module
          except ModuleNotFoundError:
              print('absent')
          else:
              print('present')" | tr -d '\r')
            echo "api image: $module $present"
            test "$present" = absent
          done

      # The only job where PostgreSQL, MinIO and the API are all real, so the
      # only place the upload path can be proved end to end. The JPEG is made
      # inside the API container, which also proves Pillow is in the deployed
      # image rather than only in the developer's virtualenv.
      # The published grading rules (spec §23), seeded from inside the API image
      # rather than from a developer's virtualenv. That is the half `uv run` at
      # home can never prove: `api.Dockerfile` syncs `--package tcg-api`, so
      # calling the bare console script — the image puts its venv on PATH — is
      # what shows `tcg-grading-companies` and the entry point actually made it
      # into the container. Run twice, because the second run is what proves the
      # write is `ON CONFLICT DO NOTHING` — a `DO UPDATE` would be refused by
      # trg_grading_rules_immutable and fail here.
      - name: The published grading rules seed into an immutable table
        run: |
          $COMPOSE exec -T api tcg-seed-grading-rules
          $COMPOSE exec -T api tcg-seed-grading-rules
          rows=$($COMPOSE exec -T postgres psql -tAqX -U tcg -d tcg \
            -c "SELECT company || '=' || version FROM grading_rules ORDER BY company")
          echo "$rows"
          test "$(echo "$rows" | wc -l | tr -d ' ')" = 3
          # The refusals, asked of the real database. Alembic compares no
          # triggers, so nothing else in CI would notice a migration that never
          # created one.
          refusal=$($COMPOSE exec -T postgres psql -qX -U tcg -d tcg \
            -c "UPDATE grading_rules SET source = 'https://elsewhere.test'" 2>&1 || true)
          echo "$refusal"
          echo "$refusal" | grep -q "grading_rules is immutable"
          overlap=$($COMPOSE exec -T postgres psql -qX -U tcg -d tcg \
            -c "INSERT INTO grading_rules (version, company, source, verified_on)
                VALUES ('tag-rules-duplicate', 'tag', 'https://example.test', '2026-08-24')" 2>&1 || true)
          echo "$overlap"
          echo "$overlap" | grep -q "uq_grading_rules_company_effective_from"

      # Runs after the seed, so the versions it reports are rows the deployed
      # database actually holds. That is the claim the unit tests cannot make:
      # they override the resolver, so nothing there proves the route queries
      # `grading_rules` rather than reading the adapters' constants.
      - name: The grading companies endpoint reports the seeded versions
        run: |
          companies=$(curl -sS -D headers.txt localhost:8000/grading-companies)
          echo "$companies" | jq .
          for company in psa tag bgs; do
            stored=$($COMPOSE exec -T postgres psql -tAqX -U tcg -d tcg \
              -c "SELECT version FROM grading_rules WHERE company = '$company'")
            served=$(echo "$companies" | jq -r --arg c "$company" \
              '.companies[] | select(.company == $c) | .rules.version')
            echo "$company: stored=$stored served=$served"
            test -n "$stored"
            test "$stored" = "$served"
          done
          # The scales differ, and that is the reason the endpoint exists: a
          # frontend rendering one shared scale misrenders one of the three.
          test "$(echo "$companies" | jq '[.companies[] | select(.grades | index("9.5"))] | length')" = 1
          test "$(echo "$companies" | jq '[.companies[] | select(.grades | index("8.5"))] | length')" = 3
          grep -qi '^cache-control: public, max-age=3600' headers.txt

      - name: A photograph uploads, validates and reaches uploaded
        run: |
          $COMPOSE exec -T api python -c "
          import sys
          from io import BytesIO
          from PIL import Image
          buffer = BytesIO()
          Image.new('RGB', (64, 48), (180, 30, 30)).save(buffer, 'JPEG')
          sys.stdout.buffer.write(buffer.getvalue())" > card.jpg
          test -s card.jpg

          id=$(curl -sS -c jar -X POST localhost:8000/analyses | jq -r .id)
          upload() {
            curl -sS -b jar -X POST "localhost:8000/analyses/$id/images?side=$1" \
              -H 'Content-Type: image/jpeg' --data-binary @card.jpg
          }
          front=$(upload front); echo "$front"
          test "$(echo "$front" | jq -r .analysis_status)" = uploading
          back=$(upload back); echo "$back"
          test "$(echo "$back" | jq -r .analysis_status)" = uploaded
          test "$(echo "$front" | jq -r .sha256)" != null

          # `uploaded` is the one state a run may start from, so a 202 here is
          # the real assertion that the state machine moved in PostgreSQL.
          run=$(curl -sS -b jar -X POST "localhost:8000/analyses/$id/run")
          echo "$run"
          test "$(echo "$run" | jq -r .status)" = queued

          # This photograph is a flat 64x48 rectangle, which spec §19's gate is
          # right to refuse: too small to measure, and with no tonal range at
          # all. So the honest end of this run is `failed` — which is also the
          # only place the gate meets a real object store, a real broker and a
          # real OpenCV, each of which the unit tests stub.
          #
          # `uploaded` as well as `identifying` means "not there yet": `run`
          # leaves the row in the first and the worker claims it into the
          # second, so waiting only on `identifying` falls straight through.
          for _ in $(seq 1 30); do
            analysis=$(curl -sS -b jar "localhost:8000/analyses/$id")
            case "$(echo "$analysis" | jq -r .status)" in
              uploaded|identifying) sleep 1 ;;
              *) break ;;
            esac
          done
          echo "$analysis"
          test "$(echo "$analysis" | jq -r .status)" = failed
          test "$(echo "$analysis" | jq -r '.images | length')" = 2
          test "$(echo "$analysis" | jq -r '.images[0].quality_status')" = unusable

          # Every condition is answered for. There is no card in a 64x48 flat
          # rectangle, so the detector reports that rather than guessing a
          # quadrilateral, and the six conditions that need one say so rather
          # than being left out — which is #37's degradation path, end to end.
          # Six and not five since #208: glare is measured on the card, so
          # without one there is nothing to measure it on.
          test "$(echo "$analysis" | jq -r '.images[0].findings | length')" = 11
          test "$(echo "$analysis" | jq -r \
            '.images[0].findings | map(select(.verdict == "undetermined")) | length')" = 6

          # And the refusal is what the confirmation endpoint reports, rather
          # than the "not ready for this yet" 409 that invites a retry §65
          # makes impossible.
          refused=$(curl -sS -b jar -X POST "localhost:8000/analyses/$id/confirm-card" \
            -H 'Content-Type: application/json' \
            -d '{"card_id":"00000000-0000-0000-0000-000000000000"}')
          echo "$refused"
          test "$(echo "$refused" | jq -r .code)" = image_quality_failure

      # #319, end to end through the real worker: a photograph with nothing
      # wrong with its *frame* — sharp, lit, large — and no card anywhere in
      # it is refused rather than waved through. This used to reach the
      # confirmation gate at `acceptable` and run the whole pipeline to an
      # `insufficient_information` that blamed the analysis for the
      # photograph's problem. The step below is the other side of the gate.
      - name: A photograph with no card in it is refused, and says which
        run: |
          $COMPOSE exec -T api python -c "
          import sys, random
          from io import BytesIO
          from PIL import Image, ImageDraw
          random.seed(0)
          # Large, and textured at a scale that survives the gate's downscale —
          # a flat fill has no detail to measure and is refused, correctly.
          picture = Image.new('RGB', (1200, 1600))
          draw = ImageDraw.Draw(picture)
          for y in range(0, 1600, 16):
              for x in range(0, 1200, 16):
                  tone = 215 if ((x // 16 + y // 16) % 2) else 20
                  tone = max(0, min(255, tone + random.randint(-18, 18)))
                  draw.rectangle([x, y, x + 15, y + 15], fill=(tone, tone, tone))
          buffer = BytesIO()
          picture.save(buffer, 'JPEG', quality=95)
          sys.stdout.buffer.write(buffer.getvalue())" > usable.jpg
          test -s usable.jpg

          id=$(curl -sS -c jar3 -X POST localhost:8000/analyses | jq -r .id)
          for side in front back; do
            curl -sS -o /dev/null -b jar3 -X POST \
              "localhost:8000/analyses/$id/images?side=$side" \
              -H 'Content-Type: image/jpeg' --data-binary @usable.jpg
          done
          curl -sS -o /dev/null -b jar3 -X POST "localhost:8000/analyses/$id/run"

          for _ in $(seq 1 30); do
            analysis=$(curl -sS -b jar3 "localhost:8000/analyses/$id")
            case "$(echo "$analysis" | jq -r .status)" in
              uploaded|identifying) sleep 1 ;;
              *) break ;;
            esac
          done
          echo "$analysis"
          test "$(echo "$analysis" | jq -r .status)" = failed
          test "$(echo "$analysis" | jq -r .failure.reason)" = unusable_photograph
          test "$(echo "$analysis" | jq -r '.images[0].quality_status')" = unusable
          # The refusal names itself, which is the one thing on the screen the
          # person holding the phone can act on.
          test "$(echo "$analysis" | jq -r '.images[0].refusal')" = no_card_found
          # And the six it could not check are still reported — #181's
          # criterion, which the refusal replaces the verdict for, not the
          # findings.
          test "$(echo "$analysis" | jq -r \
            '.images[0].findings | map(select(.verdict == "undetermined")) | length')" = 6

      # #37's acceptance criterion against the real stack, and since #319 the
      # only way an analysis reaches the confirmation gate at all: a photograph
      # with a card in it, where the boundary is found and all eleven of spec
      # §19's conditions are therefore answered. Reachable only because the
      # worker image carries the detector as well as the gate.
      - name: A photograph of a card reaches the gate with every condition answered
        run: |
          $COMPOSE exec -T api python -c "
          import sys, random
          from io import BytesIO
          from PIL import Image, ImageDraw
          random.seed(1)
          # A dark surface with a light, printed card on it at roughly a real
          # card's 63:88 proportions, filling enough of the frame to clear the
          # insufficient-card-size line and leaving a margin on every side.
          picture = Image.new('RGB', (1200, 1600), (40, 40, 40))
          draw = ImageDraw.Draw(picture)
          for y in range(0, 1600, 16):
              for x in range(0, 1200, 16):
                  tone = 40 + random.randint(-8, 8)
                  draw.point((x, y), fill=(tone, tone, tone))
          for y in range(360, 1240, 20):
              for x in range(285, 915, 20):
                  tone = 230 if ((x // 20 + y // 20) % 2) else 140
                  draw.rectangle([x, y, x + 19, y + 19], fill=(tone, tone, tone))
          buffer = BytesIO()
          picture.save(buffer, 'JPEG', quality=95)
          sys.stdout.buffer.write(buffer.getvalue())" > card.jpg
          test -s card.jpg

          id=$(curl -sS -c jar4 -X POST localhost:8000/analyses | jq -r .id)
          for side in front back; do
            curl -sS -o /dev/null -b jar4 -X POST \
              "localhost:8000/analyses/$id/images?side=$side" \
              -H 'Content-Type: image/jpeg' --data-binary @card.jpg
          done
          curl -sS -o /dev/null -b jar4 -X POST "localhost:8000/analyses/$id/run"

          for _ in $(seq 1 30); do
            analysis=$(curl -sS -b jar4 "localhost:8000/analyses/$id")
            case "$(echo "$analysis" | jq -r .status)" in
              uploaded|identifying) sleep 1 ;;
              *) break ;;
            esac
          done
          echo "$analysis"
          test "$(echo "$analysis" | jq -r .status)" = awaiting_confirmation
          test "$(echo "$analysis" | jq -r '.images[0].findings | length')" = 11
          test "$(echo "$analysis" | jq -r \
            '.images[0].findings | map(select(.verdict == "undetermined")) | length')" = 0
          test "$(echo "$analysis" | jq -r '.images[0].quality_status')" = good

      # Spec §54, the acceptance criterion of #41: expired photographs are gone
      # from BOTH stores. This is the only place that claim is made — the
      # `storage` job has both stores too since #250, but its tests delete
      # their own objects, and the sweep is only ever run here.
      - name: An expired session's photographs are deleted from object storage
        run: |
          psql() { $COMPOSE exec -T postgres psql -tAqX -U tcg -d tcg "$@"; }

          id=$(curl -sS -c jar5 -X POST localhost:8000/analyses | jq -r .id)
          for side in front back; do
            curl -sS -o /dev/null -b jar5 -X POST \
              "localhost:8000/analyses/$id/images?side=$side" \
              -H 'Content-Type: image/jpeg' --data-binary @card.jpg
          done
          curl -sS -o /dev/null -b jar5 -X POST "localhost:8000/analyses/$id/run"

          # Wait for normalization, so there are artifacts to delete as well as
          # originals — the derived image is as much a photograph of a room.
          for _ in $(seq 1 30); do
            status=$(curl -sS -b jar5 "localhost:8000/analyses/$id" | jq -r .status)
            case "$status" in uploaded|identifying) sleep 1 ;; *) break ;; esac
          done
          test "$status" = awaiting_confirmation

          keys=$(psql -c "SELECT original_uri FROM images
                          UNION ALL
                          SELECT normalized_uri FROM images WHERE normalized_uri IS NOT NULL")
          echo "$keys"
          test "$(echo "$keys" | wc -l)" -ge 4

          # Both columns, or `expires_after_it_was_created` refuses the update —
          # a row cannot exist having expired before it was made.
          psql -c "UPDATE analysis_sessions
                      SET created_at = now() - interval '8 days',
                          expires_at = now() - interval '1 day'"

          $COMPOSE exec -T worker celery --app tcg_api.analysis.worker \
            call tcg_api.analysis.purge_expired

          for _ in $(seq 1 30); do
            remaining=$(psql -c "SELECT count(*) FROM analysis_sessions")
            test "$remaining" = 0 && break
            sleep 1
          done
          test "$remaining" = 0
          test "$(psql -c "SELECT count(*) FROM images")" = 0

          # Verified against storage, which is the whole point: a deleted row is
          # not a deleted photograph. Asserted on what the interpreter printed
          # rather than on its exit status, which `compose exec` does not
          # reliably propagate — see the CV-stack step above.
          verdicts=$($COMPOSE exec -T api python -c "
          import asyncio, sys
          from tcg_api.storage import get_object_storage
          from tcg_shared.storage import ObjectNotFound, StorageKey
          async def main():
              storage = get_object_storage()
              for key in sys.argv[1:]:
                  try:
                      await storage.get(StorageKey(key))
                  except ObjectNotFound:
                      print('gone')
                  else:
                      print('PRESENT', key)
          asyncio.run(main())" $keys)
          echo "$verdicts"
          test "$(echo "$verdicts" | grep -c '^gone$')" -ge 4
          test "$(echo "$verdicts" | grep -c PRESENT)" = 0

      # The primary attack surface, against the real stack: a file is what its
      # bytes say it is, never what the request claims.
      - name: A non-image is refused as invalid_image
        run: |
          id=$(curl -sS -c jar2 -X POST localhost:8000/analyses | jq -r .id)
          refused=$(curl -sS -b jar2 -X POST "localhost:8000/analyses/$id/images?side=front" \
            -H 'Content-Type: image/jpeg' --data-binary @/bin/sh)
          echo "$refused"
          test "$(echo "$refused" | jq -r .code)" = invalid_image

      # The one place the limiter meets a real Redis: the unit tests drive it
      # through a stub, which proves the branch and not the store. Thirty is the
      # default `TCG_API_RATE_LIMIT_REQUESTS` and the steps above have already
      # spent a few of it, so the loop below is comfortably past the limit and
      # the call after it must be refused.
      - name: The analysis endpoints are rate-limited
        run: |
          for _ in $(seq 1 30); do
            curl -sS -o /dev/null -X POST localhost:8000/analyses
          done
          throttled=$(curl -sS -D - -o /dev/null -X POST localhost:8000/analyses)
          echo "$throttled"
          echo "$throttled" | grep -q "429"
          echo "$throttled" | grep -qi "^retry-after:"

      # The counter must expire, and traffic inside a window must not push that
      # expiry outwards — a plain `EXPIRE` in place of `EXPIRE ... NX` would
      # refresh it on every request and lock a steady client out for good. The
      # unit tests drive a stub that implements `nx`; this is the same claim
      # against the real server. `redis-cli` reads its password from the
      # container's own REDISCLI_AUTH.
      - name: A throttled client's window ends rather than being extended
        run: |
          redis() { $COMPOSE exec -T redis redis-cli --no-auth-warning "$@" | tr -d "\r"; }
          key=$(redis --scan --pattern "ratelimit:analyses:*" | head -1)
          test -n "$key"
          before=$(redis pttl "$key")
          test "$before" -gt 0
          sleep 2
          curl -sS -o /dev/null -X POST localhost:8000/analyses
          after=$(redis pttl "$key")
          echo "pttl $before -> $after"
          test "$after" -lt "$before"

      # The load-bearing half of "fails open" (ADR 0005). A unit test drives a
      # stub that raises, which proves the branch; only this proves that what a
      # real down Redis raises is inside the caught set — the regression it
      # guards against is a narrowed `except` turning a Redis outage into an
      # outage of the endpoints the limiter exists to keep available.
      - name: A limiter whose Redis is down does not refuse traffic
        run: |
          $COMPOSE stop redis
          test "$(curl -sS -o /dev/null -w '%{http_code}' -X POST localhost:8000/analyses)" = 201
          $COMPOSE logs api | grep -q "ratelimit.unavailable"
          $COMPOSE up -d --wait redis

      - name: The web application serves
        run: curl -fsS --retry 10 --retry-all-errors -o /dev/null localhost:3000

      # The annotation tool comes up on its own port. It is checked here rather
      # than left to the `annotation` job because what this proves is different:
      # that the two applications coexist in one stack without contending for a
      # port, which is the whole reason it has one of its own.
      - name: The annotation tool serves
        run: curl -fsS --retry 10 --retry-all-errors -o /dev/null localhost:3001

      # On a green run too: the JSON lines are spec §67's measurement, and
      # `docs/observability.md` reads its figures off this step. A dump, never
      # an assertion — a duration asserted in CI is flaky by construction.
      - name: Logs
        if: always()
        run: $COMPOSE logs --no-color

      - name: Stop the stack
        if: always()
        run: $COMPOSE down -v

  compose-production:
    name: Compose — the production overlay starts, isolated
    runs-on: ubuntu-latest
    # #273's acceptance criterion: one host with Docker, a domain and a filled
    # `.env` runs the beta from the two Compose files, with the worker isolated
    # per spec §56 and `/internal` unreachable from outside. Every line of
    # #263's checklist the overlay closes is asserted here against running
    # containers; the rendered shape is `tests/test_compose_production.py`'s.
    # Its own stack, like `e2e`, because `compose` exhausts the limiter and
    # runs the local file's deliberately open shape.
    env:
      COMPOSE: >-
        docker compose --env-file infrastructure/deployment/.env
        -f infrastructure/local/docker-compose.yml
        -f infrastructure/deployment/docker-compose.prod.yml
      BASE: https://localhost
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # From 26, containers on internal networks only get no external DNS
      # (CVE-2024-29018) — the egress step below relies on it.
      - name: Docker version
        run: docker version --format '{{.Server.Version}}'

      # Random per run, and hex because two are spliced into URLs. `localhost`
      # is what makes Caddy issue from its internal authority: the self-signed
      # certificate, so every request below is `curl -k`.
      - name: Write the host's environment
        run: |
          secret() { openssl rand -hex 24; }
          cat > infrastructure/deployment/.env <<EOF
          TCG_DOMAIN=localhost
          POSTGRES_PASSWORD=$(secret)
          MINIO_ROOT_USER=root$(openssl rand -hex 4)
          MINIO_ROOT_PASSWORD=$(secret)
          MINIO_APP_ACCESS_KEY=app$(openssl rand -hex 4)
          MINIO_APP_SECRET_KEY=$(secret)
          REDIS_PASSWORD=$(secret)
          EOF

      - name: The overlay renders, with and without its opt-in services
        run: |
          $COMPOSE config --quiet
          $COMPOSE --profile annotation --profile catalog-import config --quiet

      # Twice: the second `up` re-runs `certs`, `minio-init` and `migrate`
      # against the state the first left, which is what an operator's next
      # deploy does. Each must still exit 0.
      - name: Start the stack, twice
        run: |
          $COMPOSE up -d --wait
          $COMPOSE up -d --wait
          $COMPOSE ps -a
          for job in certs minio-init migrate; do
            code=$($COMPOSE ps -aq "$job" | xargs docker inspect -f '{{.State.ExitCode}}')
            echo "$job exited $code"
            test "$code" = 0
          done

      # Readiness proves the wiring the overlay changed: the database with the
      # host's password, storage with the scoped account, Redis over TLS.
      - name: The public surface answers over TLS
        run: |
          curl -fsSk --retry 10 --retry-all-errors "$BASE/api/health"
          readiness=$(curl -fsSk "$BASE/api/readiness")
          echo "$readiness"
          for check in database storage redis; do
            test "$(echo "$readiness" | jq -r ".checks.$check")" = ok
          done
          test "$(curl -sSk -o /dev/null -w '%{http_code}' "$BASE/")" = 200
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://localhost/)" = 308

      # Checklist item 1, and SECURITY.md's promise. The route exists — the API
      # answers it from inside — and the proxy still refuses it, however the
      # path is spelled. `--path-as-is` stops curl normalising the probes away.
      - name: Nothing under /internal, and no schema, is reachable
        run: |
          inside=$($COMPOSE exec -T api python -c "
          import urllib.error, urllib.request
          try:
              print(urllib.request.urlopen('http://localhost:8000/internal/annotation/images').status)
          except urllib.error.HTTPError as error:
              print(error.code)" | tr -d '\r')
          echo "inside the stack: $inside"
          test "$inside" != 404

          for path in /api/internal/annotation/images /api/INTERNAL/annotation/images \
              /api//internal/annotation/images /api/analyses/../internal/annotation/images \
              /api/docs /api/openapi.json; do
            code=$(curl -sSk --path-as-is -o /dev/null -w '%{http_code}' "$BASE$path")
            echo "$path -> $code"
            test "$code" = 404
          done

      # Checklist item 3: the proxy is the only thing listening on the host.
      - name: Only the proxy publishes a port
        run: |
          for port in 5432 6379 8000 9000 9001 3000 3001; do
            if timeout 2 bash -c "</dev/tcp/127.0.0.1/$port" 2>/dev/null; then
              echo "::error::port $port answers on the host"
              exit 1
            fi
          done
          docker inspect -f '{{.Name}} {{json .HostConfig.PortBindings}}' $($COMPOSE ps -q) | tee bindings.txt
          test "$(grep -vE '(\{\}|null)$' bindings.txt | grep -vc proxy)" = 0

      # Checklist item 2. Asserted on what the interpreter printed rather than
      # on an exit status, which `compose exec` does not reliably propagate
      # (see the `compose` job). The API shares the worker's isolation: both of
      # its networks are internal.
      - name: The worker and the API have no route out
        run: |
          for service in worker api; do
            verdicts=$($COMPOSE exec -T "$service" python -c "
          import socket
          for target in (('1.1.1.1', 443), ('example.com', 443)):
              try:
                  socket.create_connection(target, timeout=3).close()
              except OSError:
                  print('blocked')
              else:
                  print('REACHED', target)" | tr -d '\r')
            echo "$service: $verdicts"
            test "$(echo "$verdicts" | grep -cx blocked)" = 2
          done

      # Checklist items 4-6: a read-only root with a writable /tmp, bounded,
      # every capability dropped, uid 1001.
      - name: The worker is read-only, bounded and unprivileged
        run: |
          probe=$($COMPOSE exec -T worker python -c "
          import errno, pathlib
          try:
              pathlib.Path('/app/probe').write_text('x')
          except OSError as error:
              print('read-only' if error.errno == errno.EROFS else f'other {error.errno}')
          else:
              print('WRITABLE')
          pathlib.Path('/tmp/probe').write_text('x')
          print('tmp writable')" | tr -d '\r')
          echo "$probe"
          echo "$probe" | grep -qx read-only
          echo "$probe" | grep -qx 'tmp writable'
          test "$($COMPOSE exec -T worker id -u | tr -d '\r')" = 1001
          docker inspect -f 'memory={{.HostConfig.Memory}} pids={{.HostConfig.PidsLimit}} readonly={{.HostConfig.ReadonlyRootfs}} capdrop={{.HostConfig.CapDrop}}' \
            "$($COMPOSE ps -q worker)" | tee worker.txt
          grep -q 'readonly=true' worker.txt
          grep -q 'capdrop=\[ALL\]' worker.txt
          ! grep -qE 'memory=0 |pids=(0|<nil>) ' worker.txt

      # Checklist item 7: the key the application holds can do nothing beyond
      # its bucket. A second bucket is made with root first, because with only
      # one bucket in the store "sees only its own" proves nothing: MinIO
      # answers ListBuckets with what the caller may see, not with a refusal.
      - name: The storage account is scoped to the bucket
        run: |
          $COMPOSE exec -T minio sh -c \
            'mc alias set root http://localhost:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null && mc mb --ignore-existing root/tcg-other'
          verdicts=$($COMPOSE exec -T api python -c "
          import os
          import boto3
          from botocore.exceptions import ClientError
          env = os.environ
          client = boto3.client(
              's3',
              endpoint_url=env['TCG_API_STORAGE_ENDPOINT_URL'],
              aws_access_key_id=env['TCG_API_STORAGE_ACCESS_KEY_ID'],
              aws_secret_access_key=env['TCG_API_STORAGE_SECRET_ACCESS_KEY'],
              region_name='us-east-1',
          )
          print('visible', ' '.join(sorted(b['Name'] for b in client.list_buckets()['Buckets'])))
          for name, call in (
              ('list_objects', lambda: client.list_objects_v2(Bucket='tcg-other')),
              ('create_bucket', lambda: client.create_bucket(Bucket='tcg-escape')),
          ):
              try:
                  call()
              except ClientError as error:
                  code = error.response['Error']['Code']
                  print('denied' if code == 'AccessDenied' else f'other {code}')
              else:
                  print('ALLOWED', name)" | tr -d '\r')
          echo "$verdicts"
          echo "$verdicts" | grep -qx 'visible tcg-local'
          test "$(echo "$verdicts" | grep -cx denied)" = 2

      # Checklist item 8: the broker speaks TLS and nothing else.
      - name: The broker refuses plaintext
        run: |
          plain=$(timeout 10 $COMPOSE exec -T redis redis-cli ping 2>&1 | tr -d '\r' || true)
          echo "plaintext: $plain"
          test "$plain" != PONG
          test "$($COMPOSE exec -T redis redis-cli --tls --cacert /certs/ca.crt ping | tr -d '\r')" = PONG

      # The read-only worker, the scoped account and the TLS broker together,
      # under a real run: the photograph the `compose` job's gate answers in
      # full — a card on a surface, since #319 the only kind that reaches the
      # confirmation gate at all — through the proxy.
      - name: A photograph reaches the confirmation gate through the proxy
        run: |
          $COMPOSE exec -T api python -c "
          import sys, random
          from io import BytesIO
          from PIL import Image, ImageDraw
          random.seed(1)
          picture = Image.new('RGB', (1200, 1600), (40, 40, 40))
          draw = ImageDraw.Draw(picture)
          for y in range(0, 1600, 16):
              for x in range(0, 1200, 16):
                  tone = 40 + random.randint(-8, 8)
                  draw.point((x, y), fill=(tone, tone, tone))
          for y in range(360, 1240, 20):
              for x in range(285, 915, 20):
                  tone = 230 if ((x // 20 + y // 20) % 2) else 140
                  draw.rectangle([x, y, x + 19, y + 19], fill=(tone, tone, tone))
          buffer = BytesIO()
          picture.save(buffer, 'JPEG', quality=95)
          sys.stdout.buffer.write(buffer.getvalue())" > usable.jpg
          test -s usable.jpg

          id=$(curl -sSk -c jar -X POST "$BASE/api/analyses" | jq -r .id)
          for side in front back; do
            curl -sSk -o /dev/null -b jar -X POST "$BASE/api/analyses/$id/images?side=$side" \
              -H 'Content-Type: image/jpeg' --data-binary @usable.jpg
          done
          curl -sSk -o /dev/null -b jar -X POST "$BASE/api/analyses/$id/run"

          for _ in $(seq 1 60); do
            analysis=$(curl -sSk -b jar "$BASE/api/analyses/$id")
            case "$(echo "$analysis" | jq -r .status)" in
              uploaded|identifying) sleep 1 ;;
              *) break ;;
            esac
          done
          echo "$analysis"
          test "$(echo "$analysis" | jq -r .status)" = awaiting_confirmation

      # Checklist item 9. Every request claims a different client; the proxy
      # overwrites the claim, so they share one bucket and the limit still
      # holds. Last, because it spends the limit.
      - name: A spoofed X-Forwarded-For does not escape the limiter
        run: |
          for i in $(seq 1 31); do
            curl -sSk -o /dev/null -X POST -H "X-Forwarded-For: 203.0.113.$i" "$BASE/api/analyses"
          done
          throttled=$(curl -sSk -D - -o /dev/null -X POST -H 'X-Forwarded-For: 198.51.100.7' "$BASE/api/analyses")
          echo "$throttled"
          echo "$throttled" | grep -q "429"
          echo "$throttled" | grep -qi "^retry-after:"

      # A dump, never an assertion: the worker's limits are placeholders until
      # a real photograph is timed (docs/observability.md), and this is where
      # the first reading of its memory comes from.
      - name: Logs and resource use
        if: always()
        run: |
          docker stats --no-stream
          $COMPOSE logs --no-color

      - name: Stop the stack
        if: always()
        run: $COMPOSE down -v

  e2e:
    name: E2E — the anonymous journey in a browser
    runs-on: ubuntu-latest
    # M9's acceptance criterion is that a new user can complete an end-to-end
    # anonymous analysis, and a new user is a browser. The API journey in the
    # `storage` job proves the pipeline; this job proves the hand-offs between
    # screens, at the 375 px viewport the product is built for. It starts its
    # own stack rather than joining `compose`, because that job exhausts the
    # rate limiter on purpose part-way through and seeds no catalog. `web` and
    # `worker` pull in the api, migrate, postgres, minio and redis; the
    # annotation tool is not part of the journey and is not built.
    env:
      COMPOSE: docker compose -f infrastructure/local/docker-compose.yml
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The browser is installed here, never committed, and `--with-deps` adds
      # the system libraries Chromium needs on the runner.
      - name: Install Chromium
        run: pnpm --filter @tcg/web exec playwright install --with-deps chromium

      - uses: docker/setup-buildx-action@v4

      - name: Start the services the journey needs
        run: $COMPOSE up -d --wait web worker

      # Both are idempotent. The catalog is what `/cards` searches and what
      # `confirm-card` resolves the chosen card against (§55).
      - name: Seed the catalog and the grading rules
        run: |
          $COMPOSE exec -T api tcg-seed-catalog
          $COMPOSE exec -T api tcg-seed-grading-rules

      - name: The anonymous journey, in a browser at 375 px
        run: pnpm --filter @tcg/web e2e

      # A trace is kept only for a test that failed; it replays every step and
      # request, which is the one thing a log cannot give a screen hand-off.
      - name: Traces of the failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: apps/web/test-results/
          if-no-files-found: ignore

      # On a green run too: the JSON lines are spec §67's measurement, and
      # `docs/observability.md` reads its figures off this step. A dump, never
      # an assertion — a duration asserted in CI is flaky by construction.
      - name: Logs
        if: always()
        run: $COMPOSE logs --no-color

      - name: Stop the stack
        if: always()
        run: $COMPOSE down -v

  secrets:
    name: Secrets — no credentials in history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Scanning the diff alone is not enough. A key removed from the
          # working tree is still a leaked key, and this project may be
          # open-sourced later — history is what gets published.
          fetch-depth: 0

      # Run the tool directly rather than through an action: no licence
      # handling, no marketplace dependency, and the version is visible here.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.28.0 \
            detect --source=/repo --redact --verbose --no-banner

  dependencies:
    name: Dependencies — vulnerabilities and licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Compares a PR's dependency changes against its base, so there is
      # nothing to compare on a push or on the weekly run. The gate below has
      # no base and runs on all three — which is the point: a dependency that
      # was clean when it merged is never re-examined by this step alone.
      - uses: actions/dependency-review-action@v5
        if: github.event_name == 'pull_request'
        with:
          fail-on-severity: high
          # Copyleft licences are the concern for a product that may ship
          # commercially. Flagged for a human rather than merged silently.
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0, LGPL-3.0
          # sharp's prebuilt libvips binaries are LGPL-3.0-or-later. They are
          # unmodified shared libraries linked dynamically, they arrive only as
          # next's optional next/image dependency, and neither app uses
          # next/image — so nothing here ever loads them. Named one by one on
          # purpose: a new sharp platform package fails the gate again, which
          # is the flag-a-human behaviour the deny list is for.
          allow-dependencies-licenses: >-
            pkg:npm/%40img/sharp-libvips-darwin-arm64,
            pkg:npm/%40img/sharp-libvips-darwin-x64,
            pkg:npm/%40img/sharp-libvips-linux-arm,
            pkg:npm/%40img/sharp-libvips-linux-arm64,
            pkg:npm/%40img/sharp-libvips-linux-ppc64,
            pkg:npm/%40img/sharp-libvips-linux-riscv64,
            pkg:npm/%40img/sharp-libvips-linux-s390x,
            pkg:npm/%40img/sharp-libvips-linux-x64,
            pkg:npm/%40img/sharp-libvips-linuxmusl-arm64,
            pkg:npm/%40img/sharp-libvips-linuxmusl-x64

      # One scanner for the whole dependency tree: Trivy reads `uv.lock` and
      # `pnpm-lock.yaml` alike, so this is one pass over both workspaces rather
      # than pip-audit here and `pnpm audit` twice over in `web` and
      # `annotation` against the same lockfile.
      #
      # Unfixed findings are deliberately NOT ignored here, unlike the image
      # scan: a dependency vulnerability with no fix yet is exactly what
      # belongs on the allow-list with a reason and an expiry, rather than
      # dropped silently. The worker decodes untrusted photographs with OpenCV
      # and Pillow, and a CVE in either is the one finding this project cannot
      # read off its own code.
      - name: Audit the lockfiles
        run: |
          docker run --rm -v "$PWD:/repo" \
            aquasec/trivy:0.74.0 fs \
            --scanners vuln --severity HIGH,CRITICAL \
            --exit-code 1 --ignorefile /repo/.trivyignore.yaml \
            /repo
