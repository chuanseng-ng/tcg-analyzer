# Enforces the Definition of Done (spec §71). Without CI from the start that
# list is aspirational, so every check here maps to a line on it.
#
# Jobs are split rather than sequential so a failure names the thing that broke:
# "web" red and "python" green is a different conversation from the reverse.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A force-push supersedes the run it interrupts. `main` is exempt: those runs
# are the record of what was actually merged.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # Pinned so a toolchain bump is a reviewed commit rather than a surprise.
  NODE_VERSION: "24"

jobs:
  python:
    name: Python — lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # `--frozen` fails rather than silently relocking, so CI cannot pass
      # against a dependency set that is not the one in the lockfile.
      - run: uv sync --all-packages --frozen

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy packages/domain/src packages/shared/src services/api/src

      # Tests needing a live service are deselected here and covered by the jobs
      # that have one: `migrations` has PostgreSQL, `storage` has MinIO.
      - name: Tests
        run: uv run pytest -m "not integration and not object_storage"

  web:
    name: Web — lint, format, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # The API type check builds the FastAPI app to read its OpenAPI schema,
      # so this job needs the Python toolchain too (ADR 0001).
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: pnpm install --frozen-lockfile
      - run: uv sync --all-packages --frozen

      - name: Lint
        run: pnpm --filter @tcg/web lint

      - name: Format
        run: pnpm --filter @tcg/web format:check

      # The frontend/backend contract is the OpenAPI schema, not a shared
      # package. If the committed types no longer match it, the frontend is
      # compiling against a contract the server has stopped honouring.
      - name: API types are current
        run: pnpm --filter @tcg/web gen:api-types:check

      - name: Types
        run: pnpm --filter @tcg/web typecheck

      - name: Tests
        run: pnpm --filter @tcg/web test

      - name: Build
        run: pnpm --filter @tcg/web build

  migrations:
    name: Migrations — fresh database
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tcg
          POSTGRES_PASSWORD: tcg
          POSTGRES_DB: tcg
        ports:
          - 5432:5432
        # Without this the first migration races the database's startup.
        options: >-
          --health-cmd "pg_isready -U tcg"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TCG_API_DATABASE_URL: postgresql+asyncpg://tcg:tcg@localhost:5432/tcg

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv sync --all-packages --frozen

      # The database starts empty, so `upgrade head` here is the real assertion
      # that the migration history stands on its own. Down-and-up again proves
      # `downgrade` is not merely declared.
      - name: Apply, revert, reapply
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Integration tests
        run: uv run pytest -m integration

  storage:
    name: Storage — signed URLs against MinIO
    runs-on: ubuntu-latest

    # Not a `services:` block: MinIO needs `server /data`, and a service
    # container cannot supply a command. Running the Compose file instead has a
    # second benefit — it makes that file a tested artifact rather than one
    # nobody exercises until a developer clones the repository.
    env:
      TCG_API_STORAGE_ENDPOINT_URL: http://localhost:9000
      TCG_API_STORAGE_BUCKET: tcg-local
      TCG_API_STORAGE_ACCESS_KEY_ID: tcg
      TCG_API_STORAGE_SECRET_ACCESS_KEY: tcglocaldev

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv sync --all-packages --frozen

      # `--wait` blocks until MinIO's healthcheck passes, so the first signed
      # request does not race the store's startup.
      - name: Start MinIO
        run: >-
          docker compose -f infrastructure/local/docker-compose.yml
          up -d --wait minio

      - name: Object-storage tests
        run: uv run pytest -m object_storage

      - name: Stop MinIO
        if: always()
        run: docker compose -f infrastructure/local/docker-compose.yml down -v

  docker:
    name: Docker — API image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Build only. Publishing is a deployment concern and deliberately out of
      # scope; this answers "would this image build for anyone else?".
      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infrastructure/docker/api.Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  secrets:
    name: Secrets — no credentials in history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Scanning the diff alone is not enough. A key removed from the
          # working tree is still a leaked key, and this project may be
          # open-sourced later — history is what gets published.
          fetch-depth: 0

      # Run the tool directly rather than through an action: no licence
      # handling, no marketplace dependency, and the version is visible here.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.28.0 \
            detect --source=/repo --redact --verbose --no-banner

  dependencies:
    name: Dependencies — vulnerabilities and licences
    runs-on: ubuntu-latest
    # Compares a PR's dependency changes against its base, so there is nothing
    # to compare on a push to main.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          # Copyleft licences are the concern for a product that may ship
          # commercially. Flagged for a human rather than merged silently.
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0, LGPL-3.0
